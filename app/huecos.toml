# ============================================================================
#  Code gaps - generated file. Exclusions in tools/huecos_excluir.txt.
#
#  A gap is the span between the computed end of a function and the start
#  of the next one. There are two kinds and they are fixed differently:
#
#  1) STANDALONE FUNCTION  ->  "0xGAP" = { }
#     Usually a thunk, called indirectly. If it is not declared:
#       runtime:  [FATAL] Call to invalid or unregistered function
#
#  2) CONTINUATION         ->  "0xPARENT" = { end = 0xEND }
#     The gap is the tail of the previous function, cut off too early.
#     Its code jumps backwards, into the parent. Symptoms:
#       codegen:  Unresolved conditional branch to 0xX from 0xY
#       runtime:  [FATAL] Unresolved branch from 0xY to 0xX
#     The fix is to extend the parent up to the end of the gap, so that it is
#     a single contiguous function and the jump stays inside it.
#
#     Two things tried here earlier did not work:
#       { parent = 0x... }             -> getSize() returns 0, registerChunk
#                                         registers nothing, 0 files written
#       { parent = 0x..., size = N }   -> the fragment is still emitted
#                                         as a separate function, in another file
# ============================================================================
