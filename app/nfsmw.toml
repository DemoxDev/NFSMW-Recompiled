# ============================================================================
#  NFSMW Recomp - executable configuration
#
#  The game reads this file on startup, from ITS OWN FOLDER:
#      <.exe folder>\nfsmw.toml
#
#  The name isn't the executable's, it's the app's -"nfsmw"-, so it works the
#  same next to NFS_Most_Wanted.exe or nfsmw.exe.
#
#  Command line arguments OVERRIDE whatever is here, so you can keep testing
#  things with PROBAR_RTV.bat without touching the file.
# ============================================================================


# ----------------------------------------------------------------------------
#  EDRAM emulation path
# ----------------------------------------------------------------------------
#
#  WHAT IT IS
#  The Xbox 360 doesn't have normal render targets: it has 10 MB of embedded
#  memory -the EDRAM- where fixed hardware does blending and depth testing.
#  Emulating that can be done two ways:
#
#    "rtv"  host render targets, using the GPU normally. Fast.
#    "rov"  the EDRAM is emulated by hand inside the pixel shader, with
#           interlocks that force overlapping pixels to be processed IN
#           ORDER. More accurate and MUCH slower.
#
#  WHY IT'S SET BY HAND HERE
#  Because the SDK wasn't choosing by performance but by VENDOR
#  -src/graphics/d3d12/render_target_cache.cpp-:
#
#      path_ = vendor == kIntel ? kPixelShaderInterlock : kHostRenderTargets;
#
#  If the GPU was Intel, ROV was forced. The reason is dated in the SDK's own
#  comment: an Intel driver bug from April 2021 -a UHD 630- where the "always"
#  stencil comparison didn't work. And right next to it the comment also says
#  "The ROV path is currently much slower generally".
#
#  MEASURED IN THIS PROJECT, on an Intel Iris 540, same spot, no vsync:
#      rov (what the SDK forced)      ~10 fps
#      rtv (this)                     ~18 fps
#
#  And no visible glitches, meaning the 2021 bug is no longer in the driver.
#
#  On NVIDIA and AMD "rtv" was already the default, so setting it here changes
#  nothing for them. All this line does is take a vendor-based decision out of
#  the picture.
#
#  IF IT EVER LOOKS WRONG -ghosting, things that don't clear, leftovers from
#  the previous frame- try "rov" and compare.
render_target_path_d3d12 = "rtv"
