# ============================================================================
#  NFSMW Recomp - manual declarations for codegen
#
#  Included from nfsmw_manifest.toml via includes = ["overrides.toml"].
#  Included files use the FLAT schema (sections at the root), not the one
#  nested under [entrypoint] in the manifest.
#
#  Valid address range: 0x82000000 - 0x82CD0000
#  (image base 0x82000000 + 13,434,880 bytes of image)
# ============================================================================

# ----------------------------------------------------------------------------
#  HAND-DECLARED FUNCTIONS
#
#  Key = start address (hex, quoted).
#  Fields, all optional:
#    name             symbol name (default: sub_XXXXXXXX)
#    size             size in bytes         \ mutually exclusive
#    end              end address           /
#    parent           parent function's address (discontiguous fragment)
#    share_registers  the fragment shares the parent's registers
#
#  Without size or end, the analyzer figures out the boundaries on its own
#  from the address. That's what we want when all we need to say is "a
#  function starts here".
# ----------------------------------------------------------------------------
# --- PERFORMANCE: root-level keys (tools/rendimiento.py) ---
#
# THIS GOES UP HERE ON PURPOSE. In TOML a loose key belongs to the last table
# opened, and [functions] is opened further below. Written at the end of the
# file, cr_as_local would fall inside [functions], codegen wouldn't read it
# and would say nothing: an hour of compiling for zero changes.
#
# Written and removed by tools/rendimiento.py. Do not edit by hand.

# Condition registers as local variables instead of context fields, so the
# compiler can actually keep them in registers.
cr_as_local = true

# xer_as_local and ctr_as_local WERE TESTED AND REVERTED (2026-09-17).
#
# With both enabled the game hung deterministically, always at the same
# point: right as the guest threads that load the first track (L2RA_Sunset)
# were started as a block, with exit code -1073741681 (0xC0000135) and not a
# single [error]/[fatal] earlier in the log -exactly the pattern of an
# indirect branch (bctr) landing on a garbage address, not that of a missing
# DLL-. Reproduced the same way on two different machines.
#
# SUSPICION: ctr_as_local turns CTR from a per-thread context field into a
# local variable of each generated function. bctr/bctrl -indirect branches,
# switch tables, vtables- READ that CTR to decide where to jump. If any
# generated code expects CTR to survive across calls to other recompiled
# functions -or across a setjmp/longjmp boundary, which this project DOES
# use (see setjmp/longjmp below)-, the local copy goes out of sync with the
# real value and the indirect branch lands anywhere. xer_as_local was
# reverted at the same time out of caution, not because there is any
# evidence against it on its own: there was no time to isolate which of the
# two was to blame.
#
# Do NOT re-enable without first: (a) testing them separately -xer alone
# first, rebuild, play a long session; then ctr alone- and (b) checking
# whether ReXGlue's codegen writes CTR back to the context before every
# call/branch between functions when ctr_as_local is enabled. If it does
# not, that is a codegen bug and not something fixable from here.
# xer_as_local = true
# ctr_as_local = true

# --- end root PERFORMANCE ---

[functions]

# Two tail calls (b, unconditional branch) point here from 0x8286931C and
# 0x82866664, but automatic discovery never created a function at this
# address. Result: the Validate phase fails with
#   UnresolvedCall: 0x8285CE80 - target not in any function
# Declaring it as an entry point is enough; Discover infers the boundaries.
"0x8285CE80" = { }

# 104-byte gap after the end of sub_824EDE88 (which ends at 0x824EDEA8) and
# before the next function at 0x824EDF10. There's real code in there: the
# Write phase warned about two unresolved conditional branches,
#   0x824EDEB0 -> 0x824EDED4   and   0x824EDEC0 -> 0x824EDECC
# because the source was in no-man's-land. Declaring the start lets Discover
# claim the whole block, and the branches become internal.
"0x824EDEB0" = { }

# THE ONE THAT BROKE STARTUP:
#   [FATAL] Call to invalid or unregistered function at guest address 0x826BE258
# sub_826BE1B0 is memcpy (byte-by-byte loop + word fast path) and ends right
# at 0x826BE258. Between that end and the next function, at 0x826BE260, there
# are 8 unclaimed bytes that something calls INDIRECTLY -which is why the
# Validate phase didn't complain: it only checks direct b/bl branches-.
"0x826BE258" = { }

# Same pattern, next crash:
#   [FATAL] Call to invalid or unregistered function at guest address 0x8215FEA8
# 8-byte gap between the end of sub_8215FE90 and the function at 0x8215FEB0,
# in an area full of 8- and 16-byte functions (thunk table).
"0x8215FEA8" = { }

# The only address that showed up in the full probe (REXGLUE_SURVEY=1), with
# the game already running its main loop and feeding audio. In other words:
# with this one, there's no known unresolved indirect call left.
"0x8285CB90" = { }

# Showed up once graphics were already running, on the loading screen. The
# earlier probe didn't see it because, with state corrupted by the skipped
# functions, the game never got that far. Every time the game reaches new
# code, more of these can surface: they're indirect call targets, invisible
# to static analysis.
"0x8220C090" = { }

# In the same neighborhood as 0x8285CE80, whose callers were at 0x8286931C
# and 0x82866664. The whole 0x8285xxxx-0x8286xxxx region looks like a thunk
# table.
"0x82869668" = { }

# Same pattern as 0x8285CE80, found from the PAL ENG build (454107D9, entry
# 0x8262E9A8): tail calls (b) that automatic discovery didn't claim and the
# Validate phase rejects with "target not in any function":
#   0x8285CED0 <- 0x8286936C and 0x828666B4
#   0x82869370 <- 0x8286965C
# Only the entry point is declared; Discover infers the boundaries.
"0x8285CED0" = { }
"0x82869370" = { }

# 0x8262E768 - WITHDRAWN. Do not declare. Full explanation, because the error
# will show up again if anyone tries the build with a different ISO:
#
#   [error] XThread::Execute - No function registered at 8262E768
#
# That message did NOT mean a function was missing. 0x8262E768 was the
# EXECUTABLE'S ENTRY POINT of a DIFFERENT version of the game than ours. The
# runtime reads that address from the XEX header inside the ISO, so each
# region has its own. In our XEX the entry is at 0x8262E960; in the one from
# the person who reported the crash, at 0x8262E768.
#
# Declaring it here would cause two kinds of damage:
#   1. It would turn a message pointing at the real problem -wrong ISO- into
#      a silent crash from reading address 0.
#   2. It would split the function 0x8262E708..0x8262E7B0 in two, which is a
#      healthy function in OUR build. That's where the codegen warning
#      "Unresolved conditional branch to 0x8262E728 from 0x8262E7A4" came
#      from.
#
# HOW TO RECOGNIZE IT AGAIN: if "No function registered at X" shows up with
# X equal to the MAIN thread's start_address, it isn't a missing function.
# It means the ISO isn't the version this was built against. Comparing that
# address with our XEX's entry point settles it in a minute.

# In-game prologue cutscene:
#   [FATAL] Call to invalid or unregistered function at guest address 0x8212F670
# Another indirect call target, invisible to static analysis. Only appeared
# once the floating-point fix let the game get this far: every new stretch
# the game reaches can uncover more.
"0x8212F670" = { }

# Keep showing up in the same prologue cutscene, one per run. The usual
# pattern: indirect call targets invisible to static analysis, only uncovered
# when the game actually walks that path. 0x824B1640 came from the Release
# build, 0x823EB808 from Debug: different paths through the same stretch, not
# a difference between builds.
"0x824B1640" = { }
"0x823EB808" = { }

# ----------------------------------------------------------------------------
#  JUMP TABLES
#
#    address   address of the dispatching bctr instruction
#    register  GPR number holding the index
#    labels    targets IN INDEX ORDER (labels[0] = index 0)
#
#  Getting the order wrong isn't a compile error: it's random crashes.
# ----------------------------------------------------------------------------
# [[switch_tables]]
# address  = 0x82000000
# register = 11
# labels   = [0x82000000, 0x82000000]

# ----------------------------------------------------------------------------
#  DATA REGIONS IN .text
#    data  32-bit pattern to mark as "not code"
#    size  bytes of the region starting at each instance of the pattern
# ----------------------------------------------------------------------------
# [[invalid_instructions]]
# data = 0x00000000
# size = 16

# ----------------------------------------------------------------------------
#  MID-ASM HOOKS
#  Intercept a specific instruction without rewriting the function. This is
#  the tool for patches (disc check, framerate, resolution) without touching
#  the original binary.
#
#    address            PPC instruction to hook
#    name               C++ function to call
#    registers          list of registers passed as PPCRegister&
#    after_instruction  false = before executing it; true = after
#    return / jump_address                    unconditional flow control
#    return_on_true / return_on_false         based on what the hook returns
#    jump_address_on_true / _on_false
# ----------------------------------------------------------------------------
# [[midasm_hook]]
# address        = 0x82000000
# name           = "MyHook"
# registers      = ["r3"]
# return_on_true = true

# ----------------------------------------------------------------------------
#  INDIRECT CALL HINTS
#  Addresses we know are the target of an indirect call and that the
#  analysis didn't infer. (Not documented in the wiki.)
# ----------------------------------------------------------------------------
# indirect_calls = [0x82000000]

# ----------------------------------------------------------------------------
#  setjmp / longjmp
#  Without this, non-local jumps corrupt the thread context and the crash
#  shows up far from the cause. Locating them in the disassembly:
#    setjmp  saves r14-r31 + LR + CR + SP into r3's buffer and returns 0
#    longjmp restores that buffer and ends in mtctr/bctr
# ----------------------------------------------------------------------------
# setjmp_address  = 0x82000000
# longjmp_address = 0x82000000

# ----------------------------------------------------------------------------
#  GENERATED CODE QUALITY
#  All start at false. Enable them ONLY once the game already boots: they
#  change codegen and can mask real runtime bugs.
#  Suggested order: cr_as_local (the biggest win in code with lots of
#  branches), then xer, ctr, non_volatile, skip_lr.
# ----------------------------------------------------------------------------
# skip_lr                      = false
# skip_msr                     = false
# ctr_as_local                 = false
# xer_as_local                 = false
# cr_as_local                  = false
# reserved_as_local            = false
# non_argument_as_local        = false
# non_volatile_as_local        = false
# generate_exception_handlers  = false   # note: the wiki calls it enable_*, it's actually generate_*

# ----------------------------------------------------------------------------
#  ANALYSIS TUNING
# ----------------------------------------------------------------------------
# [analysis]
# max_jump_extension       = 65536
# data_region_threshold    = 16       # lower to 8 if there are lots of false "invalid instruction"
# large_function_threshold = 1048576
# exception_handler_funcs  = []

# ----------------------------------------------------------------------------
#  ReXCRT - map guest CRT functions to native implementations.
#  Big win: instead of running the recompiled memcpy instruction by
#  instruction, the host's is called directly. The heap group is all-or-
#  nothing.
# ----------------------------------------------------------------------------
# FINDING: the game's memcpy identified at 0x826BE1B0 (reading the generated
# C++: byte-by-byte loop, word fast path, unaligned handling, r3 left intact
# as the return value). Mapping it here replaces the recompiled loop with the
# host's memcpy: a big win, since memcpy is among the hottest code in any
# game.
# DO NOT enable it yet. Get it booting first; one variable at a time.
# [rexcrt]
# memcpy = 0x826BE1B0
#
# [rexcrt]
# RtlAllocateHeap   = 0x82000000
# RtlFreeHeap       = 0x82000000
# RtlSizeHeap       = 0x82000000
# RtlReAllocateHeap = 0x82000000
# memcpy            = 0x82000000
# memset            = 0x82000000

# --- PERFORMANCE: rexcrt (tools/rendimiento.py) ---
#
# The game's memcpy, replaced by the host's.
# sub_826BE1B0 identified by reading the generated C++: forward-only copy, no
# overlap detection, r3 left intact as the return value. It's memcpy, not
# memmove, so std::memcpy is equivalent.
#
# Written and removed by tools/rendimiento.py. Do not edit by hand.

[rexcrt]
memcpy = 0x826BE1B0

# --- end PERFORMANCE rexcrt ---
